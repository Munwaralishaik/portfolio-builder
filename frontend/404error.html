<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050816;color:#e0e6f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none}
    .page{position:relative;z-index:10;text-align:center;padding:40px 20px;animation:fadeUp 0.8s cubic-bezier(0.22,1,0.36,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

    .glitch-wrap{position:relative;display:inline-block;margin-bottom:8px}
    .glitch{
      font-size:clamp(100px,20vw,180px);font-weight:900;line-height:1;
      background:linear-gradient(135deg,#38bdf8,#818cf8,#38bdf8);
      background-size:200% auto;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:textShine 3s linear infinite;
      position:relative;
    }
    @keyframes textShine{0%{background-position:0%}100%{background-position:200%}}
    .glitch::before,.glitch::after{
      content:'404';position:absolute;top:0;left:0;width:100%;
      background:linear-gradient(135deg,#38bdf8,#818cf8);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .glitch::before{animation:glitch1 3s infinite;clip-path:polygon(0 0,100% 0,100% 35%,0 35%)}
    .glitch::after{animation:glitch2 3s infinite;clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%)}
    @keyframes glitch1{0%,90%,100%{transform:translate(0)}91%{transform:translate(-3px,-2px)}93%{transform:translate(3px,2px)}95%{transform:translate(-2px,1px)}}
    @keyframes glitch2{0%,90%,100%{transform:translate(0)}92%{transform:translate(3px,2px)}94%{transform:translate(-3px,-2px)}96%{transform:translate(2px,-1px)}}

    .astronaut{font-size:80px;display:block;margin:0 auto 24px;animation:astronautFloat 4s ease-in-out infinite}
    @keyframes astronautFloat{0%,100%{transform:translateY(0) rotate(-5deg)}25%{transform:translateY(-20px) rotate(5deg)}75%{transform:translateY(-10px) rotate(-3deg)}}

    h2{font-size:clamp(18px,4vw,28px);font-weight:700;color:#f1f5f9;margin-bottom:12px;animation:fadeUp 0.8s 0.2s both}
    p{color:rgba(180,200,230,0.55);font-size:15px;line-height:1.7;max-width:400px;margin:0 auto 36px;animation:fadeUp 0.8s 0.3s both}

    .btn-group{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp 0.8s 0.4s both}
    .btn{
      padding:13px 28px;border-radius:12px;font-size:14px;font-weight:700;
      text-decoration:none;display:inline-flex;align-items:center;gap:8px;
      transition:all 0.25s;font-family:inherit;border:none;cursor:pointer;
    }
    .btn-primary{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#020617}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(56,189,248,0.35)}
    .btn-outline{background:rgba(255,255,255,0.05);color:#e0e6f0;border:1px solid rgba(255,255,255,0.12)}
    .btn-outline:hover{background:rgba(255,255,255,0.09);transform:translateY(-3px)}

    /* Stars */
    .stars{position:fixed;inset:0;z-index:1;pointer-events:none}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite}
    @keyframes twinkle{0%,100%{opacity:0.2}50%{opacity:1}}

    /* Orbit rings */
    .orbit{position:fixed;border-radius:50%;border:1px solid rgba(56,189,248,0.08);pointer-events:none;z-index:1}
    .orbit-1{width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);animation:orbit 20s linear infinite}
    .orbit-2{width:500px;height:500px;top:50%;left:50%;transform:translate(-50%,-50%);animation:orbit 35s linear infinite reverse}
    .orbit-3{width:700px;height:700px;top:50%;left:50%;transform:translate(-50%,-50%);animation:orbit 50s linear infinite}
    @keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
    .orbit-dot{position:absolute;width:8px;height:8px;border-radius:50%;top:-4px;left:50%;transform:translateX(-50%)}
    .orbit-1 .orbit-dot{background:#38bdf8;box-shadow:0 0 10px #38bdf8}
    .orbit-2 .orbit-dot{background:#818cf8;box-shadow:0 0 10px #818cf8}
    .orbit-3 .orbit-dot{background:#ec4899;box-shadow:0 0 10px #ec4899}

    .error-code{display:inline-block;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.2);border-radius:8px;padding:4px 12px;font-size:11px;font-weight:600;color:rgba(56,189,248,0.8);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;animation:fadeUp 0.8s 0.1s both}
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Orbit rings -->
<div class="orbit orbit-1"><div class="orbit-dot"></div></div>
<div class="orbit orbit-2"><div class="orbit-dot"></div></div>
<div class="orbit orbit-3"><div class="orbit-dot"></div></div>

<div class="page">
  <span class="astronaut">🧑‍🚀</span>
  <div class="glitch-wrap">
    <div class="glitch">404</div>
  </div>
  <div class="error-code">Page Not Found</div>
  <h2>Lost in Space?</h2>
  <p>The page you're looking for has drifted off into the cosmos. Let's get you back on track.</p>
  <div class="btn-group">
    <a href="index.html" class="btn btn-primary">🏠 Go Home</a>
    <a href="dashboard.html" class="btn btn-outline">📁 Dashboard</a>
  </div>
</div>

<script>
/* Starfield */
(function(){
  const canvas=document.getElementById('bg');
  const ctx=canvas.getContext('2d');let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const stars=Array.from({length:300},()=>({x:Math.random()*5000,y:Math.random()*5000,r:Math.random()*1.6+0.2,a:Math.random(),speed:Math.random()*0.004+0.001,twinkle:Math.random()*Math.PI*2}));
  const shoots=[];setInterval(()=>{shoots.push({x:Math.random()*W,y:Math.random()*H*0.4,vx:4+Math.random()*5,vy:2+Math.random()*3,len:80+Math.random()*100,life:1});},2500);
  const orbs=[{x:0.2,y:0.2,r:200,hue:200},{x:0.8,y:0.8,r:180,hue:260},{x:0.7,y:0.1,r:150,hue:280}];
  orbs.forEach(o=>{o.vx=(Math.random()-0.5)*0.0002;o.vy=(Math.random()-0.5)*0.0002;o.a=0.05+Math.random()*0.06;o.phase=Math.random()*Math.PI*2;});
  let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H));
    bg.addColorStop(0,'#060b1f');bg.addColorStop(1,'#020408');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);t+=0.01;
    orbs.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.phase+=0.007;if(o.x<0||o.x>1)o.vx*=-1;if(o.y<0||o.y>1)o.vy*=-1;const ox=o.x*W,oy=o.y*H,p=o.a*(0.7+0.3*Math.sin(o.phase));const g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);g.addColorStop(0,`hsla(${o.hue},100%,70%,${p})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});
    stars.forEach(s=>{s.twinkle+=s.speed;const a=s.a*(0.4+0.6*Math.sin(s.twinkle));ctx.beginPath();ctx.arc(s.x%W,s.y%H,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,225,255,${a})`;ctx.fill();});
    for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.x+=s.vx;s.y+=s.vy;s.life-=0.025;if(s.life<=0||s.x>W||s.y>H){shoots.splice(i,1);continue;}const g=ctx.createLinearGradient(s.x,s.y,s.x-s.len,s.y-s.len*0.5);g.addColorStop(0,`rgba(200,240,255,${s.life*0.9})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.len,s.y-s.len*0.5);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();}
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
