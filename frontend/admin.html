<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — FolioForge</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050816;color:#e0e6f0;font-family:'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
    #bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .corner-deco{position:fixed;z-index:1;pointer-events:none}
    .corner-deco.tl{top:0;left:0;width:300px;height:300px;background:radial-gradient(circle at top left,rgba(239,68,68,0.07),transparent 70%)}
    .corner-deco.br{bottom:0;right:0;width:300px;height:300px;background:radial-gradient(circle at bottom right,rgba(167,139,250,0.08),transparent 70%)}

    .admin-page{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}

    /* ── CARD ── */
    .admin-dashboard-card{
      width:100%;max-width:1100px;
      padding:48px;border-radius:28px;
      background:rgba(10,16,35,0.88);
      border:1px solid rgba(239,68,68,0.12);
      box-shadow:0 0 80px rgba(239,68,68,0.06),0 30px 80px rgba(0,0,0,0.4);
      backdrop-filter:blur(18px);
      animation:cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
      position:relative;overflow:hidden;
    }
    .admin-dashboard-card::before{
      content:'';position:absolute;top:-2px;left:10%;width:80%;height:2px;
      background:linear-gradient(90deg,transparent,#ef4444,#a78bfa,transparent);
      animation:borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow{0%,100%{opacity:0.4}50%{opacity:1}}
    @keyframes cardIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

    /* ── HEADER ── */
    .admin-header{
      display:flex;justify-content:space-between;align-items:center;
      gap:20px;margin-bottom:40px;flex-wrap:wrap;
      padding-bottom:28px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      animation:slideIn 0.6s ease 0.1s both;
    }
    @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

    .admin-header-left{}
    .admin-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);
      border-radius:20px;padding:4px 12px;font-size:11px;
      color:rgba(239,68,68,0.9);font-weight:600;letter-spacing:1px;
      text-transform:uppercase;margin-bottom:10px;
    }
    .admin-header h1{
      font-size:32px;font-weight:800;
      background:linear-gradient(90deg,#ef4444,#f97316,#a78bfa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin-bottom:6px;
    }
    .admin-header p{color:rgba(180,200,230,0.5);font-size:14px}

    .btn-back{
      padding:11px 24px;border:none;border-radius:12px;
      background:rgba(255,255,255,0.06);color:#e0e6f0;
      font-size:14px;font-weight:600;cursor:pointer;
      font-family:inherit;transition:all 0.3s;
      border:1px solid rgba(255,255,255,0.1);
      text-decoration:none;display:inline-flex;align-items:center;gap:8px;
    }
    .btn-back:hover{background:rgba(0,198,255,0.1);border-color:rgba(0,198,255,0.25);transform:translateY(-2px)}

    /* ── STATS GRID ── */
    .admin-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:22px;
    }

    .admin-card{
      padding:32px 28px;border-radius:20px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.07);
      text-align:center;position:relative;overflow:hidden;
      transition:all 0.35s ease;
      animation:fadeUp 0.6s ease both;
      cursor:default;
    }
    .admin-card:nth-child(1){animation-delay:0.15s}
    .admin-card:nth-child(2){animation-delay:0.25s}
    .admin-card:nth-child(3){animation-delay:0.35s}

    /* glow blob */
    .admin-card::before{
      content:'';position:absolute;width:120px;height:120px;border-radius:50%;
      top:-40px;right:-40px;filter:blur(50px);opacity:0.3;transition:opacity 0.3s;
    }
    .admin-card:nth-child(1)::before{background:#38bdf8}
    .admin-card:nth-child(2)::before{background:#a78bfa}
    .admin-card:nth-child(3)::before{background:#22c55e}

    /* top accent */
    .admin-card::after{
      content:'';position:absolute;top:0;left:20%;width:60%;height:2px;
      opacity:0;transition:opacity 0.3s;
    }
    .admin-card:nth-child(1)::after{background:linear-gradient(90deg,transparent,#38bdf8,transparent)}
    .admin-card:nth-child(2)::after{background:linear-gradient(90deg,transparent,#a78bfa,transparent)}
    .admin-card:nth-child(3)::after{background:linear-gradient(90deg,transparent,#22c55e,transparent)}

    .admin-card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(56,189,248,0.2);box-shadow:0 20px 50px rgba(0,0,0,0.3)}
    .admin-card:hover::before{opacity:0.5}
    .admin-card:hover::after{opacity:1}

    .admin-icon{font-size:40px;margin-bottom:18px;display:block;animation:iconBob 3s ease-in-out infinite}
    .admin-card:nth-child(2) .admin-icon{animation-delay:0.5s}
    .admin-card:nth-child(3) .admin-icon{animation-delay:1s}
    @keyframes iconBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

    .admin-card h2{
      font-size:52px;font-weight:900;letter-spacing:-2px;
      line-height:1;margin-bottom:8px;
    }
    .admin-card:nth-child(1) h2{color:#38bdf8}
    .admin-card:nth-child(2) h2{color:#a78bfa}
    .admin-card:nth-child(3) h2{color:#4ade80}

    .admin-card p{color:rgba(180,200,230,0.5);font-size:14px;font-weight:500;letter-spacing:0.5px}

    /* ── RECENT ACTIVITY SECTION ── */
    .activity-section{margin-top:36px;animation:fadeUp 0.6s ease 0.5s both}
    .activity-header{
      display:flex;align-items:center;gap:10px;
      margin-bottom:16px;padding-bottom:12px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .activity-header h3{font-size:16px;font-weight:600;color:#f1f5f9}
    .activity-header span{font-size:11px;color:rgba(0,198,255,0.7);background:rgba(0,198,255,0.08);border:1px solid rgba(0,198,255,0.15);border-radius:12px;padding:2px 10px}

    .activity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
    .activity-item{
      background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;padding:16px 18px;
      display:flex;align-items:center;gap:12px;
      transition:all 0.25s;
    }
    .activity-item:hover{background:rgba(0,198,255,0.04);border-color:rgba(0,198,255,0.15)}
    .activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .activity-dot.cyan{background:#00c6ff;box-shadow:0 0 8px rgba(0,198,255,0.5)}
    .activity-dot.purple{background:#a78bfa;box-shadow:0 0 8px rgba(167,139,250,0.5)}
    .activity-dot.green{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.5)}
    .activity-text{font-size:13px;color:rgba(180,200,230,0.7)}
    .activity-val{font-size:15px;font-weight:700;color:#e0e6f0;margin-left:auto}

    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:600px){
      .admin-dashboard-card{padding:28px 20px}
      .admin-header{flex-direction:column;align-items:flex-start}
      .admin-header h1{font-size:24px}
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="corner-deco tl"></div>
<div class="corner-deco br"></div>

<section class="admin-page">
  <div class="admin-dashboard-card">

    <div class="admin-header">
      <div class="admin-header-left">
        <div class="admin-badge">🛡️ Admin Only</div>
        <h1>Admin Dashboard</h1>
        <p>Monitor users, portfolios and platform activity</p>
      </div>
      <a href="dashboard.html" class="btn-back">← Back To Dashboard</a>
    </div>

    <div class="admin-grid">
      <div class="admin-card">
        <span class="admin-icon">👥</span>
        <h2 id="totalUsers">0</h2>
        <p>Total Users</p>
      </div>
      <div class="admin-card">
        <span class="admin-icon">📁</span>
        <h2 id="totalPortfolios">0</h2>
        <p>Total Portfolios</p>
      </div>
      <div class="admin-card">
        <span class="admin-icon">👁️</span>
        <h2 id="totalViews">0</h2>
        <p>Total Views</p>
      </div>
    </div>

    <!-- Quick stats row -->
    <div class="activity-section">
      <div class="activity-header">
        <h3>Platform Overview</h3>
        <span>Live</span>
      </div>
      <div class="activity-grid">
        <div class="activity-item">
          <div class="activity-dot cyan"></div>
          <div class="activity-text">Avg views / portfolio</div>
          <div class="activity-val" id="avgViews">—</div>
        </div>
        <div class="activity-item">
          <div class="activity-dot purple"></div>
          <div class="activity-text">Portfolios / user</div>
          <div class="activity-val" id="avgPortfolios">—</div>
        </div>
        <div class="activity-item">
          <div class="activity-dot green"></div>
          <div class="activity-text">Platform status</div>
          <div class="activity-val" style="color:#4ade80">● Online</div>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="script.js"></script>
<script>
  // Animated counter
  function animateCount(el, target, duration=1400){
    const start = performance.now();
    function update(now){
      const p = Math.min((now-start)/duration, 1);
      const ease = 1-Math.pow(1-p,3);
      el.textContent = Math.round(ease*target);
      if(p<1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  // Override fetch stats to animate
  const origFetch = window.fetch;
  // Wait for script.js to load stats then animate
  const observer = new MutationObserver(() => {
    const users = document.getElementById('totalUsers');
    const ports = document.getElementById('totalPortfolios');
    const views = document.getElementById('totalViews');
    const u = parseInt(users.textContent)||0;
    const po = parseInt(ports.textContent)||0;
    const v = parseInt(views.textContent)||0;
    if(u>0||po>0||v>0){
      animateCount(users, u);
      animateCount(ports, po);
      animateCount(views, v);
      // Derived stats
      document.getElementById('avgViews').textContent = po>0 ? (v/po).toFixed(1) : '0';
      document.getElementById('avgPortfolios').textContent = u>0 ? (po/u).toFixed(1) : '0';
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('totalUsers'), {childList:true,characterData:true,subtree:true});

  // Starfield
  (function(){
    const canvas=document.getElementById('bg'); if(!canvas)return;
    const ctx=canvas.getContext('2d'); let W,H,mouse={x:0,y:0};
    function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
    resize(); window.addEventListener('resize',resize);
    window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
    const stars=Array.from({length:200},()=>({x:Math.random()*3000,y:Math.random()*3000,r:Math.random()*1.5+0.2,a:Math.random(),speed:Math.random()*0.004+0.001,twinkle:Math.random()*Math.PI*2}));
    const orbs=Array.from({length:4},(_,i)=>({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.0003,vy:(Math.random()-0.5)*0.0003,r:150+Math.random()*180,hue:[0,260,200,280][i],a:0.05+Math.random()*0.06,phase:Math.random()*Math.PI*2}));
    const shoots=[];
    setInterval(()=>shoots.push({x:Math.random()*W,y:Math.random()*H*0.5,vx:5+Math.random()*5,vy:2+Math.random()*3,len:100+Math.random()*100,life:1}),2800);
    let t=0;
    function draw(){
      ctx.clearRect(0,0,W,H);
      const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H));
      bg.addColorStop(0,'#0d0608');bg.addColorStop(0.5,'#060408');bg.addColorStop(1,'#020205');
      ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);t+=0.012;
      orbs.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.phase+=0.008;if(o.x<0||o.x>1)o.vx*=-1;if(o.y<0||o.y>1)o.vy*=-1;const ox=o.x*W,oy=o.y*H,p=o.a*(0.7+0.3*Math.sin(o.phase));const g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);g.addColorStop(0,`hsla(${o.hue},100%,70%,${p})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});
      stars.forEach(s=>{s.twinkle+=s.speed;const alpha=s.a*(0.4+0.6*Math.sin(s.twinkle));ctx.beginPath();ctx.arc(s.x%W,s.y%H,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(220,210,255,${alpha})`;ctx.fill();});
      for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.x+=s.vx;s.y+=s.vy;s.life-=0.022;if(s.life<=0||s.x>W||s.y>H){shoots.splice(i,1);continue;}const g=ctx.createLinearGradient(s.x,s.y,s.x-s.len,s.y-s.len*0.5);g.addColorStop(0,`rgba(255,200,200,${s.life*0.9})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.len,s.y-s.len*0.5);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();}
      if(mouse.x||mouse.y){const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,180);mg.addColorStop(0,'rgba(239,68,68,0.05)');mg.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(mouse.x,mouse.y,180,0,Math.PI*2);ctx.fillStyle=mg;ctx.fill();}
      const sy=H*((t*0.018)%1);const sg=ctx.createLinearGradient(0,sy-80,0,sy+80);sg.addColorStop(0,'transparent');sg.addColorStop(0.5,'rgba(239,68,68,0.03)');sg.addColorStop(1,'transparent');ctx.fillStyle=sg;ctx.fillRect(0,sy-80,W,160);
      requestAnimationFrame(draw);
    }
    draw();
  })();
</script>
</body>
</html>
