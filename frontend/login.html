<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User / Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="auth-page">

  <div class="auth-container">

    <div class="auth-left">
      <div class="rocket">🚀</div>
      <h2>Welcome Back</h2>
      <p>Create, publish, and manage professional portfolios with ease.</p>
    </div>

    <div class="auth-right">
      <div class="auth-tabs">
        <a href="login.html" class="active">Sign In</a>
        <a href="signup.html">Sign Up</a>
      </div>

      <h1>User / Admin Login</h1>
      <p class="auth-subtitle">Login to continue to your dashboard</p>

      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">

      <button id="loginBtn" class="btn auth-btn">Login</button>

      <p class="auth-link">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </p>
    </div>

  </div>

</section>

<script src="script.js"></script>
</body>
</html>
