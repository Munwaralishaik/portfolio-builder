<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DevFolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050816;color:#e0e6f0;font-family:'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;align-items:center;justify-content:center}
    #bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .corner-deco{position:fixed;z-index:1;pointer-events:none}
    .corner-deco.tl{top:0;left:0;width:300px;height:300px;background:radial-gradient(circle at top left,rgba(0,198,255,0.1),transparent 70%)}
    .corner-deco.br{bottom:0;right:0;width:300px;height:300px;background:radial-gradient(circle at bottom right,rgba(167,139,250,0.1),transparent 70%)}

    .auth-page{position:relative;z-index:10;width:100%;padding:24px;display:flex;align-items:center;justify-content:center;min-height:100vh}

    .auth-container{
      width:100%;max-width:1000px;min-height:560px;
      display:grid;grid-template-columns:1.1fr 0.9fr;
      border-radius:28px;overflow:hidden;
      background:rgba(10,16,35,0.88);
      border:1px solid rgba(0,198,255,0.12);
      backdrop-filter:blur(20px);
      box-shadow:0 30px 80px rgba(0,0,0,0.4);
      animation:cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

    /* LEFT PANEL */
    .auth-left{
      display:flex;flex-direction:column;justify-content:center;align-items:center;
      text-align:center;padding:60px 48px;
      background:linear-gradient(160deg,rgba(0,114,255,0.18),rgba(167,139,250,0.22));
      position:relative;overflow:hidden;
    }
    .auth-left::before{
      content:'';position:absolute;width:300px;height:300px;border-radius:50%;
      background:rgba(0,198,255,0.08);filter:blur(60px);
      top:-80px;left:-80px;animation:orbMove 8s ease-in-out infinite alternate;
    }
    .auth-left::after{
      content:'';position:absolute;width:250px;height:250px;border-radius:50%;
      background:rgba(167,139,250,0.1);filter:blur(60px);
      bottom:-60px;right:-60px;animation:orbMove2 9s ease-in-out infinite alternate;
    }
    @keyframes orbMove{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}
    @keyframes orbMove2{from{transform:translate(0,0)}to{transform:translate(-40px,-30px)}}

    /* Floating tech icons */
    .floating-icons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .fi{
      position:absolute;font-size:22px;opacity:0.15;
      animation:floatIcon linear infinite;
    }
    @keyframes floatIcon{
      0%{transform:translateY(100%) rotate(0deg);opacity:0}
      10%{opacity:0.15}
      90%{opacity:0.1}
      100%{transform:translateY(-100%) rotate(360deg);opacity:0}
    }

    .rocket{font-size:80px;margin-bottom:24px;z-index:2;animation:rocketBob 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(0,198,255,0.4))}
    @keyframes rocketBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}

    .auth-left h2{font-size:30px;font-weight:700;color:#fff;margin-bottom:12px;z-index:2;position:relative;animation:slideUp 0.6s ease 0.3s both}
    .auth-left p{color:rgba(224,240,255,0.7);font-size:15px;line-height:1.7;max-width:300px;z-index:2;position:relative;animation:slideUp 0.6s ease 0.4s both}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* Feature badges */
    .feature-badges{display:flex;flex-direction:column;gap:10px;margin-top:28px;z-index:2;position:relative;animation:slideUp 0.6s ease 0.5s both}
    .feature-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:7px 16px;font-size:13px;color:rgba(255,255,255,0.8)}

    /* RIGHT PANEL */
    .auth-right{padding:52px 48px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid rgba(255,255,255,0.05)}

    .auth-tabs{display:flex;gap:8px;margin-bottom:32px}
    .auth-tabs a{
      padding:9px 22px;border-radius:20px;text-decoration:none;
      color:rgba(180,200,230,0.5);background:rgba(255,255,255,0.04);
      font-weight:600;font-size:14px;transition:all 0.25s;border:1px solid transparent;
    }
    .auth-tabs a.active{background:rgba(0,198,255,0.12);color:#00c6ff;border-color:rgba(0,198,255,0.25)}
    .auth-tabs a:hover:not(.active){background:rgba(255,255,255,0.07);color:#e0e6f0}

    .auth-right h1{
      font-size:28px;font-weight:700;margin-bottom:6px;
      background:linear-gradient(90deg,#00c6ff,#a78bfa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:slideUp 0.5s ease 0.2s both;
    }
    .auth-subtitle{color:rgba(180,200,230,0.5);font-size:14px;margin-bottom:28px;animation:slideUp 0.5s ease 0.3s both}

    .input-group{
      position:relative;margin-bottom:16px;
      animation:slideUp 0.5s ease both;
      display:flex;align-items:center;
    }
    .input-icon{
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      font-size:15px;pointer-events:none;z-index:2;
      line-height:1;display:flex;align-items:center;
    }
    .auth-input{
      width:100%;background:rgba(255,255,255,0.04);
      border:1px solid rgba(0,198,255,0.12);
      border-radius:12px;color:#e0e6f0;
      padding:14px 44px 14px 44px;font-size:14px;
      font-family:inherit;outline:none;transition:all 0.3s;
      height:52px;
    }
    .auth-input:focus{border-color:rgba(0,198,255,0.5);background:rgba(0,198,255,0.05);box-shadow:0 0 0 3px rgba(0,198,255,0.1)}
    .auth-input:hover{border-color:rgba(0,198,255,0.25)}
    .auth-input::placeholder{color:rgba(180,200,230,0.35)}

    /* Fix browser autofill white background */
    .auth-input:-webkit-autofill,
    .auth-input:-webkit-autofill:hover,
    .auth-input:-webkit-autofill:focus,
    .auth-input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 60px rgba(10,16,40,0.98) inset !important;
      -webkit-text-fill-color: #e0e6f0 !important;
      caret-color: #e0e6f0 !important;
      border-color: rgba(0,198,255,0.3) !important;
      transition: background-color 9999s ease-in-out 0s;
    }

    /* Show/hide password */
    .toggle-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:rgba(180,200,230,0.4);transition:color 0.2s}
    .toggle-pwd:hover{color:rgba(0,198,255,0.8)}

    .auth-btn{
      width:100%;padding:14px;border:none;border-radius:12px;
      background:linear-gradient(135deg,#0072ff,#00c6ff);
      color:#fff;font-size:15px;font-weight:700;
      cursor:pointer;font-family:inherit;letter-spacing:0.5px;
      position:relative;overflow:hidden;transition:all 0.3s;
      margin-top:4px;margin-bottom:20px;
      animation:slideUp 0.5s ease 0.55s both;
    }
    .auth-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#a78bfa,#00c6ff);opacity:0;transition:opacity 0.3s}
    .auth-btn:hover::before{opacity:1}
    .auth-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,114,255,0.4)}
    .auth-btn span{position:relative;z-index:1}

    .auth-link{font-size:13px;color:rgba(180,200,230,0.5);text-align:center;animation:slideUp 0.5s ease 0.65s both}
    .auth-link a{color:#00c6ff;text-decoration:none;font-weight:600}
    .auth-link a:hover{color:#a78bfa}

    /* Divider */
    .auth-divider{display:flex;align-items:center;gap:12px;margin:4px 0 16px;animation:slideUp 0.5s ease 0.5s both}
    .auth-divider span{font-size:12px;color:rgba(180,200,230,0.3);white-space:nowrap}
    .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07)}

    /* Error message */
    .auth-error{
      display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);
      border-radius:10px;padding:10px 14px;font-size:13px;color:rgba(239,68,68,0.9);
      margin-bottom:14px;animation:shake 0.4s ease;
    }
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    @media(max-width:768px){
      .auth-container{grid-template-columns:1fr;min-height:auto}
      .auth-left{padding:40px 28px;min-height:200px}
      .auth-right{padding:36px 28px}
      .rocket{font-size:56px}
      .feature-badges{display:none}
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="corner-deco tl"></div>
<div class="corner-deco br"></div>

<div class="auth-page">
  <div class="auth-container">

    <!-- LEFT -->
    <div class="auth-left">
      <div class="floating-icons" id="floatingIcons"></div>
      <div class="rocket">🚀</div>
      <h2>Welcome Back</h2>
      <p>Create, publish, and manage professional portfolios with ease.</p>
      <div class="feature-badges">
        <div class="feature-badge">⚡ Instant publish</div>
        <div class="feature-badge">🎨 Beautiful templates</div>
        <div class="feature-badge">📊 View analytics</div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="auth-right">
      <div class="auth-tabs">
        <a href="login.html" class="active">Sign In</a>
        <a href="signup.html">Sign Up</a>
      </div>
      
      <h1>Welcome Back 👋</h1>
      <p class="auth-subtitle">Login to continue to your dashboard</p>

      <div class="auth-error" id="authError"></div>

      <div class="input-group" style="animation-delay:0.35s">
       
        <input id="loginEmail" class="auth-input" type="email" placeholder="Email address" autocomplete="email">
      </div>

      <div class="input-group" style="animation-delay:0.45s">
        
        <input id="loginPassword" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">
        <span class="toggle-pwd" id="togglePwd">👁️</span>
      </div>

      <button id="loginBtn" class="btn auth-btn"><span>Login →</span></button>

      <p class="auth-link">Don't have an account? <a href="signup.html">Create Account</a></p>
    </div>

  </div>
</div>

<script src="script.js"></script>
<script>
  // Show/hide password
  document.getElementById('togglePwd').addEventListener('click', function(){
    const input = document.getElementById('loginPassword');
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    this.textContent = isText ? '👁️' : '🙈';
  });

  // Override alert for error display
  const _orig = window.alert;
  window.alert = function(msg){
    if(typeof msg === 'string' && (msg.includes('Invalid') || msg.includes('failed') || msg.includes('❌'))){
      const el = document.getElementById('authError');
      el.textContent = '❌ ' + msg;
      el.style.display = 'block';
      el.style.animation = 'none'; el.offsetHeight;
      el.style.animation = 'shake 0.4s ease';
      setTimeout(()=>{ el.style.display='none'; }, 4000);
    } else {
      _orig(msg);
    }
  };

  // Floating tech icons
  const icons = ['⚡','🎨','💻','🚀','📊','🔥','✨','🛠️','📱','🌐'];
  const container = document.getElementById('floatingIcons');
  icons.forEach((icon, i) => {
    const el = document.createElement('div');
    el.className = 'fi';
    el.textContent = icon;
    el.style.left = (10 + Math.random() * 80) + '%';
    el.style.animationDuration = (8 + Math.random() * 8) + 's';
    el.style.animationDelay = (i * 1.2) + 's';
    el.style.fontSize = (16 + Math.random() * 14) + 'px';
    container.appendChild(el);
  });

  // Starfield
  (function(){
    const canvas=document.getElementById('bg'); if(!canvas)return;
    const ctx=canvas.getContext('2d'); let W,H,mouse={x:0,y:0};
    function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
    resize(); window.addEventListener('resize',resize);
    window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
    const stars=Array.from({length:220},()=>({x:Math.random()*3000,y:Math.random()*3000,r:Math.random()*1.5+0.2,a:Math.random(),speed:Math.random()*0.004+0.001,twinkle:Math.random()*Math.PI*2}));
    const orbs=Array.from({length:4},(_,i)=>({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.0003,vy:(Math.random()-0.5)*0.0003,r:160+Math.random()*180,hue:[200,220,260,280][i],a:0.05+Math.random()*0.07,phase:Math.random()*Math.PI*2}));
    const shoots=[];
    setInterval(()=>shoots.push({x:Math.random()*W,y:Math.random()*H*0.5,vx:5+Math.random()*5,vy:2+Math.random()*3,len:100+Math.random()*100,life:1}),2800);
    let t=0;
    function draw(){
      ctx.clearRect(0,0,W,H);
      const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H));
      bg.addColorStop(0,'#060b1f');bg.addColorStop(0.5,'#040810');bg.addColorStop(1,'#020408');
      ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);t+=0.012;
      orbs.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.phase+=0.008;if(o.x<0||o.x>1)o.vx*=-1;if(o.y<0||o.y>1)o.vy*=-1;const ox=o.x*W,oy=o.y*H,p=o.a*(0.7+0.3*Math.sin(o.phase));const g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);g.addColorStop(0,`hsla(${o.hue},100%,70%,${p})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});
      stars.forEach(s=>{s.twinkle+=s.speed;const alpha=s.a*(0.4+0.6*Math.sin(s.twinkle));ctx.beginPath();ctx.arc(s.x%W,s.y%H,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,225,255,${alpha})`;ctx.fill();});
      for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.x+=s.vx;s.y+=s.vy;s.life-=0.022;if(s.life<=0||s.x>W||s.y>H){shoots.splice(i,1);continue;}const g=ctx.createLinearGradient(s.x,s.y,s.x-s.len,s.y-s.len*0.5);g.addColorStop(0,`rgba(200,240,255,${s.life*0.9})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.len,s.y-s.len*0.5);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();}
      if(mouse.x||mouse.y){const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,180);mg.addColorStop(0,'rgba(0,198,255,0.05)');mg.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(mouse.x,mouse.y,180,0,Math.PI*2);ctx.fillStyle=mg;ctx.fill();}
      const sy=H*((t*0.018)%1);const sg=ctx.createLinearGradient(0,sy-80,0,sy+80);sg.addColorStop(0,'transparent');sg.addColorStop(0.5,'rgba(0,198,255,0.03)');sg.addColorStop(1,'transparent');ctx.fillStyle=sg;ctx.fillRect(0,sy-80,W,160);
      requestAnimationFrame(draw);
    }
    draw();
  })();
</script>
</body>
</html>
