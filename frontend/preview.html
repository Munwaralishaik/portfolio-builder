<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Preview</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* ── RESET & BASE ── */
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050816;color:#e0e6f0;font-family:'Segoe UI',sans-serif;overflow-x:hidden;min-height:100vh}

    /* ── CANVAS ── */
    #bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

    /* ── FLOATING PARTICLES ── */
    .particle{position:fixed;border-radius:50%;pointer-events:none;z-index:1;animation:particleDrift linear infinite}
    @keyframes particleDrift{
      0%{transform:translateY(100vh) scale(0);opacity:0}
      10%{opacity:1}
      90%{opacity:0.6}
      100%{transform:translateY(-20vh) scale(1);opacity:0}
    }

    /* ── PREVIEW SECTION ── */
    .preview{position:relative;z-index:10;padding:40px 20px 80px;display:flex;justify-content:center}

    /* ── PREVIEW CARD ── */
    .preview-card{
      width:100%;max-width:1000px;
      background:rgba(10,16,35,0.85)!important;
      border:1px solid rgba(0,198,255,0.15)!important;
      border-radius:28px;
      padding:50px;
      backdrop-filter:blur(16px);
      box-shadow:0 0 100px rgba(0,114,255,0.1),0 0 40px rgba(167,139,250,0.06);
      animation:cardReveal 1s cubic-bezier(0.22,1,0.36,1) both;
      position:relative;
      overflow:hidden;
    }
    .preview-card::before{
      content:'';position:absolute;top:-2px;left:10%;width:80%;height:2px;
      background:linear-gradient(90deg,transparent,#00c6ff,#a78bfa,transparent);
      animation:borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow{0%,100%{opacity:0.4}50%{opacity:1}}
    @keyframes cardReveal{from{opacity:0;transform:translateY(50px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

    /* ── PROFILE HEADER ── */
    .profile-header{
      display:flex;align-items:center;gap:40px;flex-wrap:wrap;
      padding:36px;border-radius:22px;margin-bottom:36px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(0,198,255,0.1);
      position:relative;overflow:hidden;
      animation:slideUp 0.7s ease 0.2s both;
    }
    .profile-header::after{
      content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(0,198,255,0.04),transparent);
      animation:shimmer 4s ease-in-out infinite;
    }
    @keyframes shimmer{0%{left:-100%}100%{left:200%}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* ── PROFILE IMAGE ── */
    .preview-image{
      width:160px;height:160px;border-radius:50%;object-fit:cover;
      border:3px solid transparent;
      background:linear-gradient(#0a1023,#0a1023) padding-box,
                 linear-gradient(135deg,#00c6ff,#a78bfa) border-box;
      box-shadow:0 0 40px rgba(0,198,255,0.3),0 0 80px rgba(0,198,255,0.1);
      animation:imagePop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s both, imageGlow 3s ease-in-out infinite;
      flex-shrink:0;
    }
    @keyframes imagePop{from{opacity:0;transform:scale(0.5) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
    @keyframes imageGlow{0%,100%{box-shadow:0 0 30px rgba(0,198,255,0.25)}50%{box-shadow:0 0 60px rgba(0,198,255,0.5),0 0 100px rgba(167,139,250,0.2)}}

    /* ── NAME & ROLE ── */
    .profile-info{flex:1}
    .profile-info h1{
      font-size:clamp(28px,4vw,46px);font-weight:800;
      background:linear-gradient(135deg,#00c6ff 0%,#a78bfa 50%,#00c6ff 100%);
      background-size:200% auto;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:nameSlide 0.7s ease 0.5s both, textShine 4s linear infinite;
      margin-bottom:8px;
    }
    @keyframes nameSlide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes textShine{0%{background-position:0%}100%{background-position:200%}}
    .profile-info h3{
      font-size:16px;color:rgba(0,198,255,0.8);font-weight:500;letter-spacing:1px;
      margin-bottom:14px;animation:nameSlide 0.7s ease 0.6s both;
    }
    .profile-info p{
      color:rgba(180,200,230,0.65);line-height:1.8;font-size:14px;
      animation:nameSlide 0.7s ease 0.7s both;
    }

    /* ── VIEWS BADGE ── */
    #portfolioViews{
      display:inline-block;
      background:rgba(0,198,255,0.08);border:1px solid rgba(0,198,255,0.2);
      border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(0,198,255,0.8);
      margin-top:10px;letter-spacing:0.5px;
    }

    /* ── SECTION HEADERS ── */
    .preview-section{
      padding:28px;border-radius:18px;margin-bottom:24px;
      background:rgba(255,255,255,0.025);
      border:1px solid rgba(255,255,255,0.07);
      animation:sectionIn 0.6s ease both;
      transition:border-color 0.3s,box-shadow 0.3s;
    }
    .preview-section:hover{
      border-color:rgba(0,198,255,0.2);
      box-shadow:0 0 30px rgba(0,198,255,0.05);
    }
    .preview-section:nth-child(1){animation-delay:0.3s}
    .preview-section:nth-child(2){animation-delay:0.4s}
    .preview-section:nth-child(3){animation-delay:0.5s}
    .preview-section:nth-child(4){animation-delay:0.6s}
    .preview-section:nth-child(5){animation-delay:0.7s}
    @keyframes sectionIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

    .preview-section h2{
      font-size:18px;font-weight:700;
      background:linear-gradient(90deg,#00c6ff,#a78bfa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin-bottom:18px;display:flex;align-items:center;gap:10px;
    }
    .preview-section h2::after{
      content:'';flex:1;height:1px;
      background:linear-gradient(90deg,rgba(0,198,255,0.3),transparent);
      -webkit-text-fill-color:initial;
    }

    /* ── SKILLS ── */
    .skills-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
    .skills-list span{
      background:rgba(0,198,255,0.08);
      border:1px solid rgba(0,198,255,0.2);
      color:rgba(0,198,255,0.9);
      padding:7px 16px;border-radius:30px;font-size:13px;
      transition:all 0.3s;cursor:default;
      animation:skillPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .skills-list span:hover{background:rgba(0,198,255,0.18);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,198,255,0.2)}

    /* ── PROJECTS GRID ── */
    .projects-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .project-preview{
      padding:22px;border-radius:16px;
      background:rgba(0,114,255,0.04);
      border:1px solid rgba(0,114,255,0.12);
      transition:all 0.35s ease;
      animation:cardIn2 0.5s ease both;
      position:relative;overflow:hidden;
    }
    .project-preview::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,#00c6ff,#a78bfa);
      transform:scaleX(0);transform-origin:left;transition:transform 0.3s;
    }
    .project-preview:hover{
      transform:translateY(-6px);
      box-shadow:0 16px 40px rgba(0,114,255,0.2);
      border-color:rgba(0,198,255,0.3);
      background:rgba(0,114,255,0.08);
    }
    .project-preview:hover::before{transform:scaleX(1)}
    .project-preview h3{color:#00c6ff;margin-bottom:10px;font-size:16px}
    .project-preview p{color:rgba(180,200,230,0.65);font-size:13px;line-height:1.7;margin-bottom:12px}
    .project-preview a{
      display:inline-block;color:#00c6ff;font-size:13px;font-weight:600;
      text-decoration:none;padding:5px 14px;
      border:1px solid rgba(0,198,255,0.3);border-radius:20px;
      transition:all 0.3s;margin-top:8px;
    }
    .project-preview a:hover{background:rgba(0,198,255,0.1);transform:translateX(4px)}
    @keyframes cardIn2{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

    /* ── CERT GRID ── */
    .cert-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
    .cert-card{
      padding:20px;border-radius:14px;
      background:rgba(167,139,250,0.04);
      border:1px solid rgba(167,139,250,0.12);
      transition:all 0.3s;
      position:relative;overflow:hidden;
    }
    .cert-card::after{
      content:'🏆';position:absolute;right:14px;top:14px;font-size:20px;
      opacity:0.15;transition:all 0.3s;
    }
    .cert-card:hover{transform:translateY(-4px);border-color:rgba(167,139,250,0.35);box-shadow:0 12px 30px rgba(167,139,250,0.15)}
    .cert-card:hover::after{opacity:0.6;transform:scale(1.2)}
    .cert-card h3{color:#a78bfa;margin-bottom:8px;font-size:15px}
    .cert-card p{color:rgba(180,200,230,0.6);font-size:12px;line-height:1.6}

    /* ── EXPERIENCE GRID ── */
    .experience-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .experience-card{
      padding:22px;border-radius:16px;
      background:rgba(0,198,100,0.03);
      border:1px solid rgba(0,198,100,0.1);
      border-left:3px solid rgba(0,198,255,0.5);
      transition:all 0.3s;
    }
    .experience-card:hover{transform:translateX(6px);border-left-color:#00c6ff;box-shadow:0 8px 30px rgba(0,198,255,0.1)}
    .experience-card h3{color:#00c6ff;margin-bottom:6px;font-size:15px}
    .experience-card span{display:inline-block;color:rgba(167,139,250,0.8);font-size:12px;margin-bottom:10px;letter-spacing:0.5px}
    .experience-card p{color:rgba(180,200,230,0.65);font-size:13px;line-height:1.7}

    /* ── CONTACT SECTION ── */
    .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:6px}
    .contact-item{
      display:flex;align-items:center;gap:10px;
      padding:14px 18px;border-radius:12px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.07);
      text-decoration:none;color:#e0e6f0;
      transition:all 0.3s;font-size:13px;
    }
    .contact-item:hover{background:rgba(0,198,255,0.08);border-color:rgba(0,198,255,0.25);transform:translateY(-3px);color:#00c6ff}
    .contact-item .icon{font-size:18px;flex-shrink:0}

    /* ── ACTION BUTTONS ── */
    .portfolio-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;justify-content:center}
    .btn{
      padding:12px 28px;border:none;border-radius:12px;
      font-size:14px;font-weight:600;cursor:pointer;
      font-family:inherit;transition:all 0.3s;letter-spacing:0.5px;
      text-decoration:none;display:inline-flex;align-items:center;gap:8px;
    }
    #publishBtn{
      background:linear-gradient(135deg,#0072ff,#00c6ff);color:#fff;
      box-shadow:0 0 30px rgba(0,114,255,0.4);
      position:relative;overflow:hidden;
    }
    #publishBtn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#a78bfa,#00c6ff);opacity:0;transition:opacity 0.3s}
    #publishBtn:hover::before{opacity:1}
    #publishBtn:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(0,114,255,0.5)}
    #publishBtn span{position:relative;z-index:1}


    /* ── TYPING EFFECT CURSOR ── */
    .typing-cursor{display:inline-block;width:2px;height:1em;background:#00c6ff;margin-left:2px;animation:blink 1s step-end infinite;vertical-align:middle}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    /* ── SCROLL INDICATOR ── */
    #scroll-hint{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;
      animation:hintFade 2s ease 2s both;
      pointer-events:none;
    }
    #scroll-hint span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(0,198,255,0.4)}
    .scroll-arrow{width:20px;height:20px;border-right:2px solid rgba(0,198,255,0.4);border-bottom:2px solid rgba(0,198,255,0.4);transform:rotate(45deg);animation:arrowBounce 1.5s ease-in-out infinite}
    @keyframes arrowBounce{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(5px)}}
    @keyframes hintFade{from{opacity:0}to{opacity:1}}

    /* ── CORNER DECORATIONS ── */
    .corner-deco{position:fixed;z-index:2;pointer-events:none}
    .corner-deco.tl{top:0;left:0;width:200px;height:200px;background:radial-gradient(circle at top left,rgba(0,198,255,0.08),transparent 70%)}
    .corner-deco.br{bottom:0;right:0;width:250px;height:250px;background:radial-gradient(circle at bottom right,rgba(167,139,250,0.08),transparent 70%)}

    /* ── RESPONSIVE ── */
    @media(max-width:600px){
      .preview-card{padding:24px}
      .profile-header{gap:20px}
      .preview-image{width:100px;height:100px}
      .profile-info h1{font-size:26px}
    }

    /* ── PUBLISH OVERLAY ── */
    #publishOverlay{
      position:fixed;inset:0;z-index:9999;
      background:rgba(2,4,14,0.92);
      backdrop-filter:blur(12px);
      display:none;align-items:center;justify-content:center;
      flex-direction:column;
    }
    #publishOverlay.active{display:flex;animation:overlayIn 0.4s ease both}
    @keyframes overlayIn{from{opacity:0}to{opacity:1}}

    #publishModal{
      display:flex;flex-direction:column;align-items:center;
      gap:16px;text-align:center;padding:50px 40px;
      background:rgba(10,16,36,0.95);
      border:1px solid rgba(0,198,255,0.2);
      border-radius:28px;
      box-shadow:0 0 80px rgba(0,114,255,0.2),0 0 160px rgba(0,114,255,0.08);
      animation:modalPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      position:relative;overflow:hidden;
      min-width:320px;
    }
    #publishModal::before{
      content:'';position:absolute;top:-2px;left:10%;width:80%;height:2px;
      background:linear-gradient(90deg,transparent,#00c6ff,#a78bfa,transparent);
      animation:borderGlow 2s ease-in-out infinite;
    }
    @keyframes modalPop{from{opacity:0;transform:scale(0.7) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}

    /* Orbit ring */
    #orbitRing{
      width:90px;height:90px;position:relative;
      border-radius:50%;
      border:1.5px solid rgba(0,198,255,0.15);
      animation:spin 3s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .orbit-dot{
      position:absolute;width:10px;height:10px;border-radius:50%;
      top:50%;left:50%;transform-origin:0 0;
    }
    .od1{background:#00c6ff;box-shadow:0 0 10px #00c6ff;
      transform:rotate(0deg) translateX(40px) translateY(-5px);}
    .od2{background:#a78bfa;box-shadow:0 0 10px #a78bfa;
      transform:rotate(120deg) translateX(40px) translateY(-5px);}
    .od3{background:#38bdf8;box-shadow:0 0 10px #38bdf8;
      transform:rotate(240deg) translateX(40px) translateY(-5px);}

    #publishRocket{
      font-size:48px;
      animation:rocketLaunch 1.5s ease-in-out infinite;
      filter:drop-shadow(0 0 20px rgba(0,198,255,0.6));
      margin-top:-10px;
    }
    @keyframes rocketLaunch{
      0%,100%{transform:translateY(0) rotate(-10deg)}
      50%{transform:translateY(-12px) rotate(10deg)}
    }

    #publishTitle{
      font-size:22px;font-weight:700;
      background:linear-gradient(90deg,#00c6ff,#a78bfa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    #publishSub{font-size:13px;color:rgba(180,200,230,0.5);letter-spacing:0.3px}

    #publishProgressBar{
      width:260px;height:5px;
      background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden;
    }
    #publishProgressFill{
      height:100%;width:0%;border-radius:5px;
      background:linear-gradient(90deg,#0072ff,#00c6ff,#a78bfa);
      background-size:200% auto;
      transition:width 0.4s ease;
      animation:progressShine 1.5s linear infinite;
    }
    @keyframes progressShine{
      0%{background-position:0%}100%{background-position:200%}
    }

    #publishStep{
      font-size:12px;color:rgba(0,198,255,0.7);
      letter-spacing:1px;text-transform:uppercase;
      animation:stepFade 0.4s ease both;
    }
    @keyframes stepFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* success state */
    #publishModal.success #orbitRing{display:none}
    #publishModal.success #publishRocket{animation:none;font-size:60px}
    #publishModal.success #publishTitle{
      background:linear-gradient(90deg,#00ff88,#00c6ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }


    .cert-view-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 7px 16px;
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 20px;
      color: #a78bfa !important;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
      letter-spacing: 0.3px;
    }
    .cert-view-btn:hover {
      background: rgba(167,139,250,0.2);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(167,139,250,0.2);
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <!-- PUBLISH LOADING OVERLAY -->
  <div id="publishOverlay">
    <div id="publishModal">
      <div id="orbitRing">
        <div class="orbit-dot od1"></div>
        <div class="orbit-dot od2"></div>
        <div class="orbit-dot od3"></div>
      </div>
      <div id="publishRocket">🚀</div>
      <div id="publishTitle">Publishing Portfolio</div>
      <div id="publishSub">Sending your portfolio to the world...</div>
      <div id="publishProgressBar"><div id="publishProgressFill"></div></div>
      <div id="publishStep">Preparing data...</div>
    </div>
  </div>

  <!-- Corner glows -->
  <div class="corner-deco tl"></div>
  <div class="corner-deco br"></div>

  <!-- Scroll hint -->
  <div id="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-arrow"></div>
  </div>

  <section class="preview">
    <div class="preview-card">

      <!-- Profile Header -->
      <div class="profile-header">
        <img id="previewImage" class="preview-image">
        <div class="profile-info">
          <h1 id="previewName"></h1>
          <h3 id="previewRole"></h3>
          <p id="previewAbout"></p>
          <div id="portfolioViews"></div>
        </div>
      </div>

      <!-- Skills -->
      <div class="preview-section">
        <h2>Skills</h2>
        <div id="previewSkills" class="skills-list"></div>
      </div>

      <!-- Projects -->
      <div class="preview-section">
        <h2>Projects</h2>
        <div id="previewProjects" class="projects-preview-grid"></div>
      </div>

      <!-- Certifications -->
      <div class="preview-section">
        <h2>Certifications</h2>
        <div id="previewCertifications" class="cert-preview-grid"></div>
      </div>

      <!-- Experience -->
      <div class="preview-section">
        <h2>Experience</h2>
        <div id="previewExperience" class="experience-preview-grid"></div>
      </div>

      <!-- Contact -->
      <div class="preview-section">
        <h2>Contact</h2>
        <div class="contact-grid">
          <a class="contact-item" id="previewEmailLink">
            <span class="icon">📧</span>
            <span id="previewEmail"></span>
          </a>
          <a class="contact-item" id="previewLinkedin" target="_blank">
            <span class="icon">💼</span>
            <span>LinkedIn</span>
          </a>
          <a class="contact-item" id="previewGithub" target="_blank">
            <span class="icon">🐙</span>
            <span>GitHub</span>
          </a>
          <a class="contact-item" id="previewResume" target="_blank">
            <span class="icon">📄</span>
            <span>Download Resume</span>
          </a>
          <div class="contact-item">
            <span class="icon">📱</span>
            <span id="previewPhone"></span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="portfolio-actions">
        <button type="button" id="publishBtn" class="btn"><span>🚀 Publish Portfolio</span></button>
      </div>

    </div>
  </section>

  <script src="script.js"></script>

  <script>
  // ── EPIC BACKGROUND CANVAS ───────────────────────────────
  (function(){
    const canvas = document.getElementById('bg');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, mouse = {x:0, y:0};
    function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });

    // ── Stars
    const stars = Array.from({length:300}, ()=>({
      x:Math.random()*4000, y:Math.random()*4000,
      r:Math.random()*1.8+0.2, a:Math.random(),
      speed:Math.random()*0.005+0.001,
      twinkle:Math.random()*Math.PI*2,
      hue: Math.random()>0.8 ? 200 : 220
    }));

    // ── Large glowing orbs
    const orbs = Array.from({length:6}, (_, i)=>({
      x: Math.random()*1.0, y: Math.random()*1.0,
      vx:(Math.random()-0.5)*0.0003, vy:(Math.random()-0.5)*0.0003,
      r: 180+Math.random()*220,
      hue: [200,220,260,280,190,240][i],
      a: 0.06+Math.random()*0.08,
      phase: Math.random()*Math.PI*2
    }));

    // ── Network nodes
    const nodes = Array.from({length:50}, ()=>({
      x:Math.random()*2000, y:Math.random()*2000,
      vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
      r:Math.random()*2+1,
      hue:Math.random()>0.5?200:265,
      a:Math.random()*0.6+0.3,
      pulse:Math.random()*Math.PI*2,
      pulseSpeed:Math.random()*0.04+0.01
    }));

    // ── Shooting stars
    const shoots = [];
    function spawnShoot(){
      shoots.push({
        x:Math.random()*W, y:Math.random()*H*0.5,
        vx: 4+Math.random()*6, vy: 2+Math.random()*4,
        len: 80+Math.random()*120,
        a: 0.8, life:1
      });
    }
    setInterval(spawnShoot, 2200);

    // ── Aurora waves
    const auroras = Array.from({length:3}, (_, i)=>({
      hue:[200,260,220][i], phase:i*Math.PI*0.6, speed:0.003+i*0.001, amp:60+i*30
    }));

    // ── Hex grid
    const hexes = [];
    const hexSize=70, hexW=hexSize*Math.sqrt(3), hexH=hexSize*2;
    for(let row=-1;row<Math.ceil(H/hexH)+1;row++){
      for(let col=-1;col<Math.ceil(W/hexW)+1;col++){
        hexes.push({
          cx: col*hexW + (row%2)*hexW*0.5,
          cy: row*hexH*0.75,
          phase: Math.random()*Math.PI*2,
          speed: 0.005+Math.random()*0.01
        });
      }
    }

    let t=0;
    function drawHex(cx,cy,size,alpha){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const angle=Math.PI/180*(60*i-30);
        const x=cx+size*Math.cos(angle), y=cy+size*Math.sin(angle);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle=`rgba(0,198,255,${alpha})`;
      ctx.lineWidth=0.5;
      ctx.stroke();
    }

    function draw(){
      ctx.clearRect(0,0,W,H);

      // Deep space base
      const bg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,Math.max(W,H));
      bg.addColorStop(0,'#060b1f');
      bg.addColorStop(0.5,'#040810');
      bg.addColorStop(1,'#020408');
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

      t+=0.012;

      // ── AURORA waves at top
      auroras.forEach(a=>{
        a.phase+=a.speed;
        const gradient=ctx.createLinearGradient(0,0,0,H*0.45);
        gradient.addColorStop(0,`hsla(${a.hue},100%,60%,0)`);
        gradient.addColorStop(0.3,`hsla(${a.hue},100%,60%,0.06)`);
        gradient.addColorStop(0.6,`hsla(${a.hue},100%,60%,0.03)`);
        gradient.addColorStop(1,`hsla(${a.hue},100%,60%,0)`);
        ctx.beginPath();
        ctx.moveTo(0,0);
        for(let x=0;x<=W;x+=8){
          const y=H*0.15+Math.sin(x*0.005+a.phase)*a.amp+Math.sin(x*0.01+a.phase*1.3)*30;
          ctx.lineTo(x,y);
        }
        ctx.lineTo(W,0); ctx.closePath();
        ctx.fillStyle=gradient; ctx.fill();
      });

      // ── LARGE GLOWING ORBS
      orbs.forEach(o=>{
        o.x+=o.vx; o.y+=o.vy;
        if(o.x<0||o.x>1){o.vx*=-1}
        if(o.y<0||o.y>1){o.vy*=-1}
        o.phase+=0.008;
        const ox=o.x*W, oy=o.y*H;
        const pulse=o.a*(0.7+0.3*Math.sin(o.phase));
        const g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);
        g.addColorStop(0,`hsla(${o.hue},100%,70%,${pulse})`);
        g.addColorStop(0.4,`hsla(${o.hue},100%,60%,${pulse*0.4})`);
        g.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(ox,oy,o.r,0,Math.PI*2);
        ctx.fillStyle=g; ctx.fill();
      });

      // ── HEX GRID (subtle, pulsing)
      hexes.forEach(h=>{
        h.phase+=h.speed;
        const alpha=0.015+0.02*Math.abs(Math.sin(h.phase));
        drawHex(h.cx, h.cy, hexSize*0.48, alpha);
      });

      // ── TWINKLING STARS
      stars.forEach(s=>{
        s.twinkle+=s.speed;
        const alpha=s.a*(0.4+0.6*Math.sin(s.twinkle));
        const x=s.x%W, y=s.y%H;
        // star cross shape for bigger ones
        if(s.r>1.2){
          ctx.save();
          ctx.translate(x,y);
          ctx.strokeStyle=`rgba(180,220,255,${alpha*0.4})`;
          ctx.lineWidth=0.5;
          ctx.beginPath(); ctx.moveTo(-s.r*3,0); ctx.lineTo(s.r*3,0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0,-s.r*3); ctx.lineTo(0,s.r*3); ctx.stroke();
          ctx.restore();
        }
        ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(200,225,255,${alpha})`; ctx.fill();
      });

      // ── SHOOTING STARS
      for(let i=shoots.length-1;i>=0;i--){
        const s=shoots[i];
        s.x+=s.vx; s.y+=s.vy; s.life-=0.02;
        if(s.life<=0||s.x>W||s.y>H){ shoots.splice(i,1); continue; }
        const grad=ctx.createLinearGradient(s.x,s.y,s.x-s.vx/s.vx*s.len,s.y-s.vy/s.vy*s.len/2);
        grad.addColorStop(0,`rgba(200,240,255,${s.life*0.9})`);
        grad.addColorStop(1,'transparent');
        ctx.beginPath();
        ctx.moveTo(s.x,s.y);
        ctx.lineTo(s.x-s.vx*(s.len/s.vx),s.y-s.vy*(s.len/s.vx));
        ctx.strokeStyle=grad; ctx.lineWidth=1.5; ctx.stroke();
        // glow head
        const g2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,4);
        g2.addColorStop(0,`rgba(200,240,255,${s.life})`);
        g2.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(s.x,s.y,4,0,Math.PI*2);
        ctx.fillStyle=g2; ctx.fill();
      }

      // ── NETWORK NODES + CONNECTIONS
      nodes.forEach(n=>{
        n.x+=n.vx; n.y+=n.vy;
        if(n.x<0)n.x=W; if(n.x>W)n.x=0;
        if(n.y<0)n.y=H; if(n.y>H)n.y=0;
        n.pulse+=n.pulseSpeed;
        const nr=n.r*(0.8+0.4*Math.sin(n.pulse));
        const ng=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,nr*4);
        ng.addColorStop(0,`hsla(${n.hue},100%,70%,${n.a})`);
        ng.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(n.x,n.y,nr*4,0,Math.PI*2);
        ctx.fillStyle=ng; ctx.fill();
        ctx.beginPath(); ctx.arc(n.x,n.y,nr,0,Math.PI*2);
        ctx.fillStyle=`hsla(${n.hue},100%,80%,${n.a})`; ctx.fill();
      });

      for(let i=0;i<nodes.length;i++){
        for(let j=i+1;j<nodes.length;j++){
          const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
          const dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<160){
            const alpha=0.18*(1-dist/160);
            ctx.beginPath();
            ctx.moveTo(nodes[i].x,nodes[i].y);
            ctx.lineTo(nodes[j].x,nodes[j].y);
            ctx.strokeStyle=`rgba(0,198,255,${alpha})`;
            ctx.lineWidth=0.8; ctx.stroke();
          }
        }
      }

      // ── MOUSE REPULSE GLOW
      if(mouse.x||mouse.y){
        const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,200);
        mg.addColorStop(0,'rgba(0,198,255,0.04)');
        mg.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(mouse.x,mouse.y,200,0,Math.PI*2);
        ctx.fillStyle=mg; ctx.fill();
      }

      // ── SCAN LINE
      const sy=H*((t*0.018)%1);
      const sg=ctx.createLinearGradient(0,sy-80,0,sy+80);
      sg.addColorStop(0,'transparent');
      sg.addColorStop(0.5,'rgba(0,198,255,0.04)');
      sg.addColorStop(1,'transparent');
      ctx.fillStyle=sg; ctx.fillRect(0,sy-80,W,160);

      requestAnimationFrame(draw);
    }
    draw();
  })();

  // ── FLOATING PARTICLES DOM ────────────────────────────────
  (function(){
    const colors = ['rgba(0,198,255,0.6)','rgba(167,139,250,0.6)','rgba(0,114,255,0.4)'];
    for(let i=0;i<15;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random()*4+2;
      p.style.cssText = `
        width:${size}px;height:${size}px;
        left:${Math.random()*100}vw;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${Math.random()*12+8}s;
        animation-delay:${Math.random()*8}s;
        box-shadow:0 0 ${size*3}px ${colors[0]};
      `;
      document.body.appendChild(p);
    }
  })();

  // ── SKILL STAGGER ANIMATION ───────────────────────────────
  function animateSkills(){
    document.querySelectorAll('.skills-list span').forEach((el,i)=>{
      el.style.animationDelay = (i*0.06)+'s';
    });
  }
  setTimeout(animateSkills, 500);

  // ── SCROLL HINT HIDE ─────────────────────────────────────
  window.addEventListener('scroll', ()=>{
    const hint = document.getElementById('scroll-hint');
    if(hint && window.scrollY > 100) hint.style.opacity='0';
  });

  // ── PUBLISH LOADING ANIMATION ────────────────────────────
  (function(){
    const publishBtn = document.getElementById('publishBtn');
    if(!publishBtn) return;

    const overlay = document.getElementById('publishOverlay');
    const modal = document.getElementById('publishModal');
    const fill = document.getElementById('publishProgressFill');
    const stepEl = document.getElementById('publishStep');
    const titleEl = document.getElementById('publishTitle');
    const subEl = document.getElementById('publishSub');
    const rocket = document.getElementById('publishRocket');

    const steps = [
      {label:'Preparing your data...', pct:15},
      {label:'Uploading profile image...', pct:35},
      {label:'Saving portfolio...', pct:55},
      {label:'Generating your link...', pct:75},
      {label:'Almost there...', pct:90},
    ];

    function showStep(i){
      if(i>=steps.length) return;
      stepEl.style.animation='none';
      stepEl.offsetHeight; // reflow
      stepEl.style.animation='stepFade 0.4s ease both';
      stepEl.textContent = steps[i].label;
      fill.style.width = steps[i].pct + '%';
    }

    // Override window.alert to intercept script.js success/error alerts
    const _origAlert = window.alert;
    window.alert = function(msg) {
      if(typeof msg === 'string' && msg.toLowerCase().includes('published successfully')) {
        // Show success inside overlay
        fill.style.width = '100%';
        modal.classList.add('success');
        titleEl.textContent = 'Published! 🎉';
        subEl.textContent = 'Taking you to your portfolio...';
        rocket.textContent = '✅';
        stepEl.textContent = 'Portfolio is live!';
        // Restore alert after 1.5s then let script.js redirect
        setTimeout(()=>{ window.alert = _origAlert; }, 1500);
      } else if(typeof msg === 'string' && (msg.toLowerCase().includes('error') || msg.toLowerCase().includes('failed'))) {
        // Show error state
        fill.style.width = '0%';
        rocket.textContent = '❌';
        titleEl.textContent = 'Something went wrong';
        subEl.textContent = msg;
        stepEl.textContent = 'Please try again';
        setTimeout(()=>{ 
          overlay.classList.remove('active'); 
          window.alert = _origAlert; 
        }, 2500);
      } else if(typeof msg === 'string' && msg.toLowerCase().includes('server error')) {
        fill.style.width = '0%';
        rocket.textContent = '❌';
        titleEl.textContent = 'Server Error';
        subEl.textContent = 'Please logout, login again and retry';
        stepEl.textContent = msg;
        setTimeout(()=>{ overlay.classList.remove('active'); window.alert = _origAlert; }, 3000);
      } else {
        // Any other alert — hide overlay and show normally
        overlay.classList.remove('active');
        window.alert = _origAlert;
        _origAlert(msg);
      }
    };

    // Show overlay and start step animation on click
    publishBtn.addEventListener('click', function(){
      overlay.classList.add('active');
      fill.style.width = '0%';
      stepEl.textContent = 'Preparing data...';
      titleEl.textContent = 'Publishing Portfolio';
      subEl.textContent = 'Sending your portfolio to the world...';
      rocket.textContent = '🚀';
      modal.classList.remove('success');
      steps.forEach((s, i) => {
        setTimeout(()=> showStep(i), i * 900);
      });
    }, true);

    // Close overlay on background click (error fallback)
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) {
        overlay.classList.remove('active');
        window.alert = _origAlert;
      }
    });
  })();

  // ── INTERSECTION OBSERVER for sections ───────────────────
  // sections use CSS animation — always visible
  </script>

</body>
