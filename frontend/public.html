<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050816;color:#e0e6f0;font-family:'Segoe UI',sans-serif;overflow-x:hidden;min-height:100vh}

    #bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

    .particle{position:fixed;border-radius:50%;pointer-events:none;z-index:1;animation:particleDrift linear infinite}
    @keyframes particleDrift{
      0%{transform:translateY(100vh) scale(0);opacity:0}
      10%{opacity:1}90%{opacity:0.6}
      100%{transform:translateY(-20vh) scale(1);opacity:0}
    }

    .preview{position:relative;z-index:10;padding:40px 20px 80px;display:flex;justify-content:center}

    .preview-card{
      width:100%;max-width:1000px;
      background:rgba(10,16,35,0.85)!important;
      border:1px solid rgba(0,198,255,0.15)!important;
      border-radius:28px;padding:50px;
      backdrop-filter:blur(16px);
      box-shadow:0 0 100px rgba(0,114,255,0.1),0 0 40px rgba(167,139,250,0.06);
      animation:cardReveal 1s cubic-bezier(0.22,1,0.36,1) both;
      position:relative;overflow:hidden;
    }
    .preview-card::before{
      content:'';position:absolute;top:-2px;left:10%;width:80%;height:2px;
      background:linear-gradient(90deg,transparent,#00c6ff,#a78bfa,transparent);
      animation:borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow{0%,100%{opacity:0.4}50%{opacity:1}}
    @keyframes cardReveal{from{opacity:0;transform:translateY(50px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

    .profile-header{
      display:flex;align-items:center;gap:40px;flex-wrap:wrap;
      padding:36px;border-radius:22px;margin-bottom:36px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(0,198,255,0.1);
      position:relative;overflow:hidden;
      animation:slideUp 0.7s ease 0.2s both;
    }
    .profile-header::after{
      content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(0,198,255,0.04),transparent);
      animation:shimmer 4s ease-in-out infinite;
    }
    @keyframes shimmer{0%{left:-100%}100%{left:200%}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .preview-image{
      width:160px;height:160px;border-radius:50%;object-fit:cover;
      border:3px solid transparent;
      background:linear-gradient(#0a1023,#0a1023) padding-box,
                 linear-gradient(135deg,#00c6ff,#a78bfa) border-box;
      box-shadow:0 0 40px rgba(0,198,255,0.3);
      animation:imagePop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s both,imageGlow 3s ease-in-out infinite;
      flex-shrink:0;
    }
    @keyframes imagePop{from{opacity:0;transform:scale(0.5) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
    @keyframes imageGlow{0%,100%{box-shadow:0 0 30px rgba(0,198,255,0.25)}50%{box-shadow:0 0 60px rgba(0,198,255,0.5),0 0 100px rgba(167,139,250,0.2)}}

    .profile-info{flex:1}
    .profile-info h1{
      font-size:clamp(28px,4vw,46px);font-weight:800;
      background:linear-gradient(135deg,#00c6ff 0%,#a78bfa 50%,#00c6ff 100%);
      background-size:200% auto;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:nameSlide 0.7s ease 0.5s both,textShine 4s linear infinite;
      margin-bottom:8px;
    }
    @keyframes nameSlide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes textShine{0%{background-position:0%}100%{background-position:200%}}
    .profile-info h3{font-size:16px;color:rgba(0,198,255,0.8);font-weight:500;letter-spacing:1px;margin-bottom:14px;animation:nameSlide 0.7s ease 0.6s both}
    .profile-info p{color:rgba(180,200,230,0.65);line-height:1.8;font-size:14px;animation:nameSlide 0.7s ease 0.7s both}

    #portfolioViews{
      display:inline-block;
      background:rgba(0,198,255,0.08);border:1px solid rgba(0,198,255,0.2);
      border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(0,198,255,0.8);
      margin-top:10px;letter-spacing:0.5px;
    }

    .preview-section{
      padding:28px;border-radius:18px;margin-bottom:24px;
      background:rgba(255,255,255,0.025);
      border:1px solid rgba(255,255,255,0.07);
      transition:border-color 0.3s,box-shadow 0.3s;
      animation:sectionIn 0.6s ease both;
    }
    .preview-section:nth-child(1){animation-delay:0.1s}
    .preview-section:nth-child(2){animation-delay:0.2s}
    .preview-section:nth-child(3){animation-delay:0.3s}
    .preview-section:nth-child(4){animation-delay:0.4s}
    .preview-section:nth-child(5){animation-delay:0.5s}
    @keyframes sectionIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .preview-section:hover{border-color:rgba(0,198,255,0.2);box-shadow:0 0 30px rgba(0,198,255,0.05)}

    .preview-section h2{
      font-size:18px;font-weight:700;
      background:linear-gradient(90deg,#00c6ff,#a78bfa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin-bottom:18px;display:flex;align-items:center;gap:10px;
    }
    .preview-section h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,198,255,0.3),transparent)}

    .skills-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
    .skills-list span{
      background:rgba(0,198,255,0.08);border:1px solid rgba(0,198,255,0.2);
      color:rgba(0,198,255,0.9);padding:7px 16px;border-radius:30px;font-size:13px;
      transition:all 0.3s;cursor:default;
      animation:skillPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .skills-list span:hover{background:rgba(0,198,255,0.18);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,198,255,0.2)}
    @keyframes skillPop{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}

    .projects-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .project-preview{
      padding:22px;border-radius:16px;
      background:rgba(0,114,255,0.04);border:1px solid rgba(0,114,255,0.12);
      transition:all 0.35s ease;position:relative;overflow:hidden;
    }
    .project-preview::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,#00c6ff,#a78bfa);
      transform:scaleX(0);transform-origin:left;transition:transform 0.3s;
    }
    .project-preview:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,114,255,0.2);border-color:rgba(0,198,255,0.3)}
    .project-preview:hover::before{transform:scaleX(1)}
    .project-preview h3{color:#00c6ff;margin-bottom:10px;font-size:16px}
    .project-preview p{color:rgba(180,200,230,0.65);font-size:13px;line-height:1.7;margin-bottom:12px}
    .project-preview a{
      display:inline-block;color:#00c6ff;font-size:13px;font-weight:600;
      text-decoration:none;padding:5px 14px;
      border:1px solid rgba(0,198,255,0.3);border-radius:20px;
      transition:all 0.3s;margin-top:8px;
    }
    .project-preview a:hover{background:rgba(0,198,255,0.1);transform:translateX(4px)}

    .cert-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
    .cert-card{
      padding:20px;border-radius:14px;
      background:rgba(167,139,250,0.04);border:1px solid rgba(167,139,250,0.12);
      transition:all 0.3s;position:relative;overflow:hidden;
    }
    .cert-card::after{content:'🏆';position:absolute;right:14px;top:14px;font-size:20px;opacity:0.15;transition:all 0.3s}
    .cert-card:hover{transform:translateY(-4px);border-color:rgba(167,139,250,0.35);box-shadow:0 12px 30px rgba(167,139,250,0.15)}
    .cert-card:hover::after{opacity:0.6;transform:scale(1.2)}
    .cert-card h3{color:#a78bfa;margin-bottom:8px;font-size:15px}
    .cert-card p{color:rgba(180,200,230,0.6);font-size:12px;line-height:1.6}

    .experience-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .experience-card{
      padding:22px;border-radius:16px;
      background:rgba(0,198,100,0.03);border:1px solid rgba(0,198,100,0.1);
      border-left:3px solid rgba(0,198,255,0.5);transition:all 0.3s;
    }
    .experience-card:hover{transform:translateX(6px);border-left-color:#00c6ff;box-shadow:0 8px 30px rgba(0,198,255,0.1)}
    .experience-card h3{color:#00c6ff;margin-bottom:6px;font-size:15px}
    .experience-card span{display:inline-block;color:rgba(167,139,250,0.8);font-size:12px;margin-bottom:10px;letter-spacing:0.5px}
    .experience-card p{color:rgba(180,200,230,0.65);font-size:13px;line-height:1.7}

    /* Contact */
    .preview-section p{margin-bottom:10px;color:rgba(180,200,230,0.7);font-size:14px}
    .preview-section a{color:#00c6ff;text-decoration:none;transition:color 0.2s}
    .preview-section a:hover{color:#a78bfa}

    /* Action buttons */
    .portfolio-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;justify-content:center}
    .btn{
      padding:11px 24px;border:none;border-radius:12px;
      font-size:14px;font-weight:600;cursor:pointer;
      font-family:inherit;transition:all 0.3s;letter-spacing:0.5px;
      text-decoration:none;display:inline-flex;align-items:center;gap:8px;
    }
    .owner-only{}
    #editBtn{background:rgba(255,255,255,0.06);color:#e0e6f0;border:1px solid rgba(255,255,255,0.15)}
    #editBtn:hover{background:rgba(255,255,255,0.12);transform:translateY(-2px)}
    #copyLinkBtn{background:rgba(0,198,255,0.08);color:#00c6ff;border:1px solid rgba(0,198,255,0.2)}
    #copyLinkBtn:hover{background:rgba(0,198,255,0.15);transform:translateY(-2px)}
    .delete-btn{background:rgba(239,68,68,0.08);color:rgba(239,68,68,0.8);border:1px solid rgba(239,68,68,0.2)}
    .delete-btn:hover{background:rgba(239,68,68,0.15);transform:translateY(-2px)}
    .back-dashboard-btn{background:rgba(167,139,250,0.08);color:#a78bfa;border:1px solid rgba(167,139,250,0.2)}
    .back-dashboard-btn:hover{background:rgba(167,139,250,0.15);transform:translateY(-2px)}

    /* corner glows */
    .corner-deco{position:fixed;z-index:2;pointer-events:none}
    .corner-deco.tl{top:0;left:0;width:200px;height:200px;background:radial-gradient(circle at top left,rgba(0,198,255,0.08),transparent 70%)}
    .corner-deco.br{bottom:0;right:0;width:250px;height:250px;background:radial-gradient(circle at bottom right,rgba(167,139,250,0.08),transparent 70%)}

    /* scroll hint */
    #scroll-hint{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;
      animation:hintFade 2s ease 2s both;pointer-events:none;transition:opacity 0.4s;
    }
    #scroll-hint span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(0,198,255,0.4)}
    .scroll-arrow{width:20px;height:20px;border-right:2px solid rgba(0,198,255,0.4);border-bottom:2px solid rgba(0,198,255,0.4);transform:rotate(45deg);animation:arrowBounce 1.5s ease-in-out infinite}
    @keyframes arrowBounce{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(5px)}}
    @keyframes hintFade{from{opacity:0}to{opacity:1}}

    @media(max-width:600px){
      .preview-card{padding:24px}
      .profile-header{gap:20px}
      .preview-image{width:100px;height:100px}
      .profile-info h1{font-size:26px}
      .portfolio-actions{flex-direction:column}
      .btn{justify-content:center}
    }

    .cert-view-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 7px 16px;
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 20px;
      color: #a78bfa !important;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
      letter-spacing: 0.3px;
    }
    .cert-view-btn:hover {
      background: rgba(167,139,250,0.2);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(167,139,250,0.2);
    }

    /* ── SHARE BUTTONS ── */
    .share-section{
      margin-top:28px;
      padding:24px;
      border-radius:18px;
      background:rgba(255,255,255,0.025);
      border:1px solid rgba(255,255,255,0.07);
    }
    .share-title{
      font-size:13px;font-weight:600;
      color:rgba(180,200,230,0.5);
      letter-spacing:1px;text-transform:uppercase;
      margin-bottom:14px;display:flex;align-items:center;gap:8px;
    }
    .share-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.08),transparent)}
    .share-buttons{display:flex;flex-wrap:wrap;gap:10px}
    .share-btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 18px;border-radius:12px;
      font-size:13px;font-weight:600;cursor:pointer;
      border:none;font-family:inherit;
      transition:all 0.3s;text-decoration:none;
      position:relative;overflow:hidden;
    }
    .share-btn::before{
      content:'';position:absolute;inset:0;
      opacity:0;transition:opacity 0.3s;
    }
    .share-btn:hover::before{opacity:1}
    .share-btn:hover{transform:translateY(-3px)}
    .share-btn span{position:relative;z-index:1}
    .share-btn .btn-icon{font-size:16px;position:relative;z-index:1}

    .share-wa{background:rgba(37,211,102,0.12);color:#25d366;border:1px solid rgba(37,211,102,0.25)}
    .share-wa::before{background:rgba(37,211,102,0.08)}
    .share-wa:hover{box-shadow:0 8px 24px rgba(37,211,102,0.2)}

    .share-tw{background:rgba(29,161,242,0.12);color:#1da1f2;border:1px solid rgba(29,161,242,0.25)}
    .share-tw::before{background:rgba(29,161,242,0.08)}
    .share-tw:hover{box-shadow:0 8px 24px rgba(29,161,242,0.2)}

    .share-li{background:rgba(10,102,194,0.12);color:#0a66c2;border:1px solid rgba(10,102,194,0.25)}
    .share-li::before{background:rgba(10,102,194,0.08)}
    .share-li:hover{box-shadow:0 8px 24px rgba(10,102,194,0.2)}

    .share-copy{background:rgba(0,198,255,0.1);color:#00c6ff;border:1px solid rgba(0,198,255,0.25)}
    .share-copy::before{background:rgba(0,198,255,0.08)}
    .share-copy:hover{box-shadow:0 8px 24px rgba(0,198,255,0.2)}

    .share-copy.copied{background:rgba(34,197,94,0.12);color:#22c55e;border-color:rgba(34,197,94,0.25)}

    /* Toast */
    #shareToast{
      position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
      z-index:999;background:rgba(0,198,100,0.12);
      border:1px solid rgba(0,198,100,0.3);border-radius:12px;
      padding:12px 24px;font-size:13px;color:rgba(0,230,120,0.9);
      display:none;align-items:center;gap:8px;white-space:nowrap;
      box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }
    @keyframes toastUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>

      border-left: 3px solid rgba(0,198,255,0.5) !important;
    }
    .preview-card .experience-card h3   { color: #00c6ff !important; margin-bottom: 6px !important; }
    .preview-card .experience-card span { color: rgba(167,139,250,0.8) !important; display: block !important; margin-bottom: 8px !important; font-size: 12px !important; }
    .preview-card .experience-card p    { color: rgba(180,200,230,0.7) !important; font-size: 13px !important; line-height: 1.7 !important; }
    .preview-card #previewSkills:empty::after,
    .preview-card #previewProjects:empty::after,
    .preview-card #previewCertifications:empty::after,
    .preview-card #previewExperience:empty::after {
      content: 'No data added' !important;
      color: rgba(180,200,230,0.3) !important;

<body>

  <canvas id="bg"></canvas>
  <div id="shareToast">✅ <span id="shareToastMsg">Link copied!</span></div>
  <div class="corner-deco tl"></div>
  <div class="corner-deco br"></div>

  <div id="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-arrow"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <section class="preview">
    <div class="preview-card">

      <div class="profile-header">
        <img id="previewImage" class="preview-image">
        <div class="profile-info">
          <h1 id="previewName"></h1>
          <h3 id="previewRole"></h3>
          <p id="previewAbout"></p>
          <p id="portfolioViews">👁️ Views: 0</p>
        </div>
      </div>

      <div class="preview-section">
        <h2>Skills</h2>
        <div id="previewSkills" class="skills-list"></div>
      </div>

      <div class="preview-section">
        <h2>Projects</h2>
        <div id="previewProjects" class="projects-preview-grid"></div>
      </div>

      <div class="preview-section">
        <h2>Certifications</h2>
        <div id="previewCertifications" class="cert-preview-grid"></div>
      </div>

      <div class="preview-section">
        <h2>Experience</h2>
        <div id="previewExperience" class="experience-preview-grid"></div>
      </div>

      <div class="preview-section">
        <h2>Contact</h2>
        <p>📧 <a id="previewEmail"></a></p>
        <p>💼 <a id="previewLinkedin" target="_blank">LinkedIn</a></p>
        <p>📄 <a id="previewResume" target="_blank">Download Resume</a></p>
        <p>🐙 <a id="previewGithub" target="_blank">GitHub</a></p>
        <p id="previewPhone"></p>
      </div>

      <!-- Share Section -->
      <div class="share-section">
        <div class="share-title">🔗 Share Portfolio</div>
        <div class="share-buttons">
          <button class="share-btn share-wa" onclick="shareWhatsApp()">
            <span class="btn-icon">💬</span><span>WhatsApp</span>
          </button>
          <button class="share-btn share-tw" onclick="shareTwitter()">
            <span class="btn-icon">🐦</span><span>Twitter</span>
          </button>
          <button class="share-btn share-li" onclick="shareLinkedIn()">
            <span class="btn-icon">💼</span><span>LinkedIn</span>
          </button>
          <button class="share-btn share-copy" id="shareCopyBtn" onclick="shareCopy()">
            <span class="btn-icon">🔗</span><span id="shareCopyText">Copy Link</span>
          </button>
          <button class="share-btn owner-only" id="editBtn" style="background:rgba(167,139,250,0.1);color:#a78bfa;border:1px solid rgba(167,139,250,0.25)">
            <span class="btn-icon">✏️</span><span>Edit</span>
          </button>
          <button class="share-btn owner-only" id="deleteBtn" style="background:rgba(239,68,68,0.08);color:#f87171;border:1px solid rgba(239,68,68,0.2)">
            <span class="btn-icon">🗑️</span><span>Delete</span>
          </button>
          <button class="share-btn owner-only" onclick="window.location.href='/dashboard.html'" style="background:rgba(0,198,255,0.08);color:#00c6ff;border:1px solid rgba(0,198,255,0.2)">
            <span class="btn-icon">🏠</span><span>Dashboard</span>
          </button>
        </div>
      </div>



    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="/script.js"></script>

  <script>
  // ── EPIC BACKGROUND ───────────────────────────────────────
  (function(){
    const canvas = document.getElementById('bg');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, mouse={x:0,y:0};
    function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });

    const stars = Array.from({length:300}, ()=>({
      x:Math.random()*4000, y:Math.random()*4000,
      r:Math.random()*1.8+0.2, a:Math.random(),
      speed:Math.random()*0.005+0.001, twinkle:Math.random()*Math.PI*2
    }));

    const orbs = Array.from({length:6}, (_,i)=>({
      x:Math.random(), y:Math.random(),
      vx:(Math.random()-0.5)*0.0003, vy:(Math.random()-0.5)*0.0003,
      r:180+Math.random()*220, hue:[200,220,260,280,190,240][i],
      a:0.06+Math.random()*0.08, phase:Math.random()*Math.PI*2
    }));

    const nodes = Array.from({length:50}, ()=>({
      x:Math.random()*2000, y:Math.random()*2000,
      vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
      r:Math.random()*2+1, hue:Math.random()>0.5?200:265,
      a:Math.random()*0.6+0.3, pulse:Math.random()*Math.PI*2,
      pulseSpeed:Math.random()*0.04+0.01
    }));

    const shoots=[];
    setInterval(()=>{
      shoots.push({x:Math.random()*W,y:Math.random()*H*0.5,
        vx:4+Math.random()*6,vy:2+Math.random()*4,
        len:80+Math.random()*120,life:1});
    }, 2200);

    const auroras=[{hue:200,phase:0,speed:0.003,amp:60},{hue:260,phase:2,speed:0.004,amp:90},{hue:220,phase:4,speed:0.005,amp:70}];

    const hexes=[];
    const hs=70,hw=hs*Math.sqrt(3),hh=hs*2;
    for(let r=-1;r<30;r++) for(let c=-1;c<30;c++)
      hexes.push({cx:c*hw+(r%2)*hw*0.5,cy:r*hh*0.75,phase:Math.random()*Math.PI*2,speed:0.005+Math.random()*0.01});

    function drawHex(cx,cy,size,alpha){
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);ctx.lineTo(cx+size*Math.cos(a),cy+size*Math.sin(a));}
      ctx.closePath(); ctx.strokeStyle=`rgba(0,198,255,${alpha})`; ctx.lineWidth=0.5; ctx.stroke();
    }

    let t=0;
    function draw(){
      ctx.clearRect(0,0,W,H);
      const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H));
      bg.addColorStop(0,'#060b1f'); bg.addColorStop(0.5,'#040810'); bg.addColorStop(1,'#020408');
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
      t+=0.012;

      auroras.forEach(a=>{
        a.phase+=a.speed;
        const g=ctx.createLinearGradient(0,0,0,H*0.45);
        g.addColorStop(0,`hsla(${a.hue},100%,60%,0)`);
        g.addColorStop(0.3,`hsla(${a.hue},100%,60%,0.06)`);
        g.addColorStop(1,`hsla(${a.hue},100%,60%,0)`);
        ctx.beginPath(); ctx.moveTo(0,0);
        for(let x=0;x<=W;x+=8){ctx.lineTo(x,H*0.15+Math.sin(x*0.005+a.phase)*a.amp+Math.sin(x*0.01+a.phase*1.3)*30);}
        ctx.lineTo(W,0); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
      });

      orbs.forEach(o=>{
        o.x+=o.vx; o.y+=o.vy; o.phase+=0.008;
        if(o.x<0||o.x>1)o.vx*=-1; if(o.y<0||o.y>1)o.vy*=-1;
        const ox=o.x*W,oy=o.y*H,pulse=o.a*(0.7+0.3*Math.sin(o.phase));
        const g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);
        g.addColorStop(0,`hsla(${o.hue},100%,70%,${pulse})`);
        g.addColorStop(0.4,`hsla(${o.hue},100%,60%,${pulse*0.4})`);
        g.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(ox,oy,o.r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      });

      hexes.forEach(h=>{
        h.phase+=h.speed;
        drawHex(h.cx,h.cy,hs*0.48,0.015+0.02*Math.abs(Math.sin(h.phase)));
      });

      stars.forEach(s=>{
        s.twinkle+=s.speed;
        const alpha=s.a*(0.4+0.6*Math.sin(s.twinkle)),x=s.x%W,y=s.y%H;
        if(s.r>1.2){
          ctx.save(); ctx.translate(x,y);
          ctx.strokeStyle=`rgba(180,220,255,${alpha*0.4})`; ctx.lineWidth=0.5;
          ctx.beginPath(); ctx.moveTo(-s.r*3,0); ctx.lineTo(s.r*3,0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0,-s.r*3); ctx.lineTo(0,s.r*3); ctx.stroke();
          ctx.restore();
        }
        ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(200,225,255,${alpha})`; ctx.fill();
      });

      for(let i=shoots.length-1;i>=0;i--){
        const s=shoots[i]; s.x+=s.vx; s.y+=s.vy; s.life-=0.02;
        if(s.life<=0||s.x>W||s.y>H){shoots.splice(i,1);continue;}
        const g=ctx.createLinearGradient(s.x,s.y,s.x-s.len,s.y-s.len*0.5);
        g.addColorStop(0,`rgba(200,240,255,${s.life*0.9})`); g.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.len,s.y-s.len*0.5);
        ctx.strokeStyle=g; ctx.lineWidth=1.5; ctx.stroke();
        const g2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,4);
        g2.addColorStop(0,`rgba(200,240,255,${s.life})`); g2.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(s.x,s.y,4,0,Math.PI*2); ctx.fillStyle=g2; ctx.fill();
      }

      nodes.forEach(n=>{
        n.x+=n.vx; n.y+=n.vy; n.pulse+=n.pulseSpeed;
        if(n.x<0)n.x=W; if(n.x>W)n.x=0; if(n.y<0)n.y=H; if(n.y>H)n.y=0;
        const nr=n.r*(0.8+0.4*Math.sin(n.pulse));
        const ng=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,nr*4);
        ng.addColorStop(0,`hsla(${n.hue},100%,70%,${n.a})`); ng.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(n.x,n.y,nr*4,0,Math.PI*2); ctx.fillStyle=ng; ctx.fill();
        ctx.beginPath(); ctx.arc(n.x,n.y,nr,0,Math.PI*2);
        ctx.fillStyle=`hsla(${n.hue},100%,80%,${n.a})`; ctx.fill();
      });
      for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<160){
          ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y);
          ctx.strokeStyle=`rgba(0,198,255,${0.18*(1-dist/160)})`; ctx.lineWidth=0.8; ctx.stroke();
        }
      }

      if(mouse.x||mouse.y){
        const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,200);
        mg.addColorStop(0,'rgba(0,198,255,0.04)'); mg.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(mouse.x,mouse.y,200,0,Math.PI*2); ctx.fillStyle=mg; ctx.fill();
      }

      const sy=H*((t*0.018)%1);
      const sg=ctx.createLinearGradient(0,sy-80,0,sy+80);
      sg.addColorStop(0,'transparent'); sg.addColorStop(0.5,'rgba(0,198,255,0.04)'); sg.addColorStop(1,'transparent');
      ctx.fillStyle=sg; ctx.fillRect(0,sy-80,W,160);

      requestAnimationFrame(draw);
    }
    draw();
  })();

  // ── FLOATING DOM PARTICLES ────────────────────────────────
  (function(){
    const colors=['rgba(0,198,255,0.6)','rgba(167,139,250,0.6)','rgba(0,114,255,0.4)'];
    for(let i=0;i<15;i++){
      const p=document.createElement('div');
      p.className='particle';
      const size=Math.random()*4+2;
      p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*8}s;box-shadow:0 0 ${size*3}px ${colors[0]};`;
      document.body.appendChild(p);
    }
  })();

  // sections use CSS animation — no JS observer needed

  // ── SCROLL HINT ───────────────────────────────────────────
  window.addEventListener('scroll',()=>{
    const h=document.getElementById('scroll-hint');
    if(h&&window.scrollY>100)h.style.opacity='0';
  });

  // ── SKILL STAGGER ─────────────────────────────────────────
  setTimeout(()=>{
    document.querySelectorAll('.skills-list span').forEach((el,i)=>{
      el.style.animationDelay=(i*0.06)+'s';
    });
  },600);

  // ── SHARE FUNCTIONS ───────────────────────────────────────
  function getShareUrl(){
    return window.location.origin + '/p/' + (window.location.pathname.replace('/p/','') || new URLSearchParams(window.location.search).get('id') || '');
  }

  function getShareText(){
    const name = document.getElementById('previewName')?.innerText || 'My Portfolio';
    const role = document.getElementById('previewRole')?.innerText || '';
    return `Check out ${name}'s portfolio${role ? ' — ' + role : ''}!`;
  }

  function shareWhatsApp(){
    const url = encodeURIComponent(getShareUrl());
    const text = encodeURIComponent(getShareText());
    window.open(`https://wa.me/?text=${text}%20${url}`, '_blank');
  }

  function shareTwitter(){
    const url = encodeURIComponent(getShareUrl());
    const text = encodeURIComponent(getShareText());
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
  }

  function shareLinkedIn(){
    const url = encodeURIComponent(getShareUrl());
    window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${url}`, '_blank');
  }

  function shareCity(){
    const url = getShareUrl();
    navigator.clipboard.writeText(url).then(()=>{
      const btn = document.getElementById('shareCopyBtn');
      const txt = document.getElementById('shareCopyText');
      btn.classList.add('copied');
      txt.textContent = 'Copied! ✅';
      showShareToast('Link copied to clipboard!');
      setTimeout(()=>{ btn.classList.remove('copied'); txt.textContent = 'Copy Link'; }, 2500);
    });
  }

  function shareopy(){
    shareCity();
  }

  function shareCopy(){
    const url = getShareUrl();
    navigator.clipboard.writeText(url).then(()=>{
      const btn = document.getElementById('shareCopyBtn');
      const txt = document.getElementById('shareCopyText');
      btn.classList.add('copied');
      txt.textContent = 'Copied! ✅';
      showShareToast('🔗 Link copied to clipboard!');
      setTimeout(()=>{ btn.classList.remove('copied'); txt.textContent = 'Copy Link'; }, 2500);
    }).catch(()=>{
      // Fallback for mobile
      const el = document.createElement('textarea');
      el.value = url;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showShareToast('🔗 Link copied!');
    });
  }

  function showShareToast(msg){
    const toast = document.getElementById('shareToast');
    const toastMsg = document.getElementById('shareToastMsg');
    if(!toast) return;
    toastMsg.textContent = msg;
    toast.style.display = 'flex';
    toast.style.animation = 'none';
    toast.offsetHeight;
    toast.style.animation = 'toastUp 0.4s ease both';
    setTimeout(()=>{ toast.style.display='none'; }, 2500);
  }

  // Native share API on mobile
  if(navigator.share){
    // Add native share button on mobile
    window.addEventListener('load', ()=>{
      const shareButtons = document.querySelector('.share-buttons');
      if(shareButtons && window.innerWidth < 768){
        const nativeBtn = document.createElement('button');
        nativeBtn.className = 'share-btn share-copy';
        nativeBtn.style.background = 'rgba(167,139,250,0.1)';
        nativeBtn.style.color = '#a78bfa';
        nativeBtn.style.borderColor = 'rgba(167,139,250,0.25)';
        nativeBtn.innerHTML = '<span class="btn-icon">📤</span><span>Share</span>';
        nativeBtn.onclick = ()=>{
          navigator.share({
            title: document.getElementById('previewName')?.innerText || 'Portfolio',
            text: getShareText(),
            url: getShareUrl()
          });
        };
        shareButtons.prepend(nativeBtn);
      }
    });
  }
  </script>

</body>
