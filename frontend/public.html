<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Preview</title>
 <link rel="stylesheet" href="./style.css">
</head>
<body>
  
    <canvas id="bg"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<section class="preview">

  <div class="preview-card">

    <div class="profile-header">

      <img id="previewImage" class="preview-image">

      <div class="profile-info">
        <h1 id="previewName"></h1>
        <h3 id="previewRole"></h3>
        <p id="previewAbout"></p>
        <p id="portfolioViews">👁️ Views: 0</p>
      </div>

    </div>

    <div class="preview-section">
      <h2>Skills</h2>
      <div id="previewSkills" class="skills-list"></div>
    </div>

    <div class="preview-section">
      <h2>Projects</h2>
      <div id="previewProjects" class="projects-preview-grid"></div>
    </div>

    <div class="preview-section">
      <h2>Certifications</h2>
      <div id="previewCertifications" class="cert-preview-grid"></div>
    </div>

         <div class="preview-section">
        <h2>Experience</h2>
        <div id="previewExperience" class="experience-preview-grid"></div>
        </div>
    <div class="preview-section">
      <h2>Contact</h2>

      <p>📧 <a id="previewEmail"></a></p>

      <p>
        💼
        <a id="previewLinkedin" target="_blank">LinkedIn</a>
      </p>
      <p>
        📄
        <a id="previewResume" target="_blank">Download Resume
        </a>
      </p>
      <p>
        🐱
        <a id="previewGithub" target="_blank">GitHub</a>
      </p>
      

      <p id="previewPhone"></p>
    </div>
  <div class="portfolio-actions">

  <button id="editBtn" class="btn owner-only">
    Edit Portfolio
  </button>

  <button id="copyLinkBtn" class="btn">
    Copy Portfolio Link
  </button>

  <button id="deleteBtn" class="btn delete-btn owner-only">
    Delete Portfolio
  </button>

  <button onclick="window.location.href='/dashboard.html'" class="btn owner-only">
    Back To Dashboard
  </button>


</div>

</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="/script.js"></script>

</body>
</html>
