<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="auth-page">

  <div class="auth-container">

    <div class="auth-left">
      <div class="rocket">✨</div>
      <h2>Start Your Portfolio</h2>
      <p>Build your professional online presence and share it with recruiters.</p>
    </div>

    <div class="auth-right">
      <div class="auth-tabs">
        <a href="login.html">Sign In</a>
        <a href="signup.html" class="active">Sign Up</a>
      </div>

      <h1>Create Account</h1>
      <p class="auth-subtitle">Register to build your portfolio</p>

      <input id="signupName" type="text" placeholder="Full Name">
      <input id="signupEmail" type="email" placeholder="Email">
      <input id="signupPassword" type="password" placeholder="Password">

      <button id="signupBtn" class="btn auth-btn">Signup</button>

      <p class="auth-link">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>

  </div>

</section>

<script src="script.js"></script>
</body>
</html>
